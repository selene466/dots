# yellow = '#faba4a'
# blue = '#8db0ff'
# magenta = '#c7a9ff'
# cyan = '#a4daff'
# white = '#c0caf5'

# Indexed Colors
[[colors.indexed_colors]]
index = 16
color = '#ff9e64'

[[colors.indexed_colors]]
index = 17
color = '#db4b4b'

[colors]
draw_bold_text_with_bright_colors = false

