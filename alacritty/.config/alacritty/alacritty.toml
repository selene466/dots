
[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1"

[window]
dynamic_padding = false
decorations = "full"
title = "selene@gaia"
opacity = 1
decorations_theme_variant = "Dark"

[window.padding]
x = 10
y = 10

[window.dimensions]
columns = 100
lines = 30

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 10000
multiplier = 3

# Default colors
[colors.primary]
background = '#1a1b26'
foreground = '#c0caf5'
# storm
# background = '#24283b'
# foreground = '#c0caf5'

[colors.cursor]
cursor = '#faf0fb'
text = '#24283b'

# Normal colors
[colors.normal]
black = '#1d202f'
red = '#f7768e'
green = '#9ece6a'
yellow = '#e0af68'
blue = '#7aa2f7'
magenta = '#bb9af7'
cyan = '#7dcfff'
white = '#a9b1d6'
