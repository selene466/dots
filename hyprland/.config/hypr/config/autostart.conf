# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/defaults.conf

# Autostart wiki https://wiki.hyprland.org/0.45.0/Configuring/Keywords/#executing #

exec-once = gnome-keyring-daemon -sd
exec-once = swaybg -o \* -i /usr/share/wallpapers/cachyos-wallpapers/BlueFeathers.png -m fill
#exec-once = waybar &
# exec-once = gBar bar 0 &
exec-once = hyprpanel &
# exec-once = fcitx5 -d &
# exec-once = mako --default-timeout 5000 &
exec-once = copyq &
# exec-once = nm-applet --indicator &
exec-once = mpd ~/mpd/config/mpd.conf &
exec-once = bash -c "mkfifo /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob && tail -f /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob | wob & disown" &
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &

# dark theme, pacman -S adw-gtk-theme
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"  
exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3-dark"

# ## Slow app launch fix
exec-once = systemctl --user import-environment &
exec-once = hash dbus-update-activation-environment 2>/dev/null &
exec-once = dbus-update-activation-environment --systemd &

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ## Idle configuration
exec-once = $idlehandler
